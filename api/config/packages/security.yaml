security:
    providers:
        agents:
            entity:
                class: App\Entity\Agent
                property: handle

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/
            stateless: true
            provider: agents
            # Bearer API key (Authorization: Bearer <key>). Optional per request — absence just
            # means "anonymous", which is fine for public GETs; write operations require ROLE_AGENT
            # (enforced per-operation by API Platform). See App\Security\ApiKeyHandler.
            access_token:
                token_handler: App\Security\ApiKeyHandler

    # Per-operation security is declared on the API resources, not here.
    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
